"488.6666666666667" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#222222">necesidades.txt</text><polyline points="640.5,410 640.5,470" fill="none" stroke="#F9A825" stroke-width="1.8" marker-end="url(#flecha_F9A825)" marker-start="url(#flecha_F9A825i)"/><rect x="721" y="470" width="125" height="52" rx="10" ry="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/><text x="783.5" y="492.1666666666667" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#222222">recursos.txt</text><text x="783.5" y="507.1666666666667" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#222222">movimientos.txt</text><polyline points="783.5,410 783.5,470" fill="none" stroke="#F9A825" stroke-width="1.8" marker-end="url(#flecha_F9A825)" marker-start="url(#flecha_F9A825i)"/><rect x="864" y="470" width="125" height="30" rx="10" ry="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/><text x="926.5" y="488.6666666666667" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#222222">albergues.txt</text><polyline points="926.5,410 926.5,470" fill="none" stroke="#F9A825" stroke-width="1.8" marker-end="url(#flecha_F9A825)" marker-start="url(#flecha_F9A825i)"/><rect x="1007" y="470" width="125" height="30" rx="10" ry="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/><text x="1069.5" y="488.6666666666667" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#222222">personas.txt</text><polyline points="1069.5,410 1069.5,470" fill="none" stroke="#F9A825" stroke-width="1.8" marker-end="url(#flecha_F9A825)" marker-start="url(#flecha_F9A825i)"/><rect x="1150" y="470" width="125" height="30" rx="10" ry="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/><text x="1212.5" y="488.6666666666667" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#222222">mensajes.txt</text><polyline points="1212.5,410 1212.5,470" fill="none" stroke="#F9A825" stroke-width="1.8" marker-end="url(#flecha_F9A825)" marker-start="url(#flecha_F9A825i)"/><rect x="1293" y="470" width="125" height="30" rx="10" ry="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/><text x="1355.5" y="488.6666666666667" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#222222">mascotas.txt</text><polyline points="1355.5,410 1355.5,470" fill="none" stroke="#F9A825" stroke-width="1.8" marker-end="url(#flecha_F9A825)" marker-start="url(#flecha_F9A825i)"/><rect x="736.5" y="431.0" width="380" height="18" fill="#FFFFFF" fill-opacity="0.92" rx="4"/><text x="926.5" y="444.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#B8860B">init/1 carga el archivo · después de cada cambio se guarda</text><rect x="330" y="600" width="1090" height="150" rx="12" ry="12" fill="#F9FBE7" stroke="#9E9D24" stroke-width="2"/><text x="350" y="626" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#827717">Qué pasa si un servidor se cae (Process.exit(pid, :kill))</text><text x="350" y="652" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">1. El SupervisorPrincipal detecta que el proceso murió y lo reinicia (solo ese: estrategia :one_for_one).</text><text x="350" y="672" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">2. El proceso nuevo ejecuta init/1, que carga su archivo de texto: recupera el estado que tenía.</text><text x="350" y="692" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">3. Los demás procesos ni se enteran. Si ServidorUsuarios es el que cae, se cierran las sesiones huérfanas.</text><text x="350" y="712" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">4. Si hubiera más de 5 reinicios en 10 segundos, el supervisor se rinde (algo anda muy mal).</text><text x="350" y="732" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">Los GenServers procesan un mensaje a la vez: por eso no hay inconsistencias con solicitudes simultáneas.</text></svg>